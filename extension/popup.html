<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 20px;
      background: #0a0a0a;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo {
      width: 24px;
      height: 24px;
      background: #F2AA4C;
      border-radius: 6px;
    }
    h1 {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
      color: #F2AA4C;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
    }
    .label {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 4px;
    }
    .value {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #F2AA4C;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(242, 170, 76, 0.3);
    }
    #status {
      font-size: 10px;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" class="logo" alt="Logo">
    <h1>Intelligence</h1>
  </div>

  <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
    <div id="tab-sync" style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #F2AA4C; cursor: pointer;">Sync</div>
    <div id="tab-profile" style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); cursor: pointer;">Profile</div>
  </div>

  <div id="view-sync">
    <div id="job-info" class="container" style="display: none;">
      <div class="card">
        <div class="label">Company</div>
        <div id="company" class="value">Detecting...</div>
      </div>
      <div class="card">
        <div class="label">Position</div>
        <div id="role" class="value">Detecting...</div>
      </div>
      <button id="sync-btn">Analyze This Job</button>
      <button id="autofill-btn" style="background: transparent; border: 1px solid #F2AA4C; color: #F2AA4C; margin-top: 10px;">Autofill Application</button>
    </div>

    <div id="no-job" style="text-align: center; padding: 20px 0;">
      <p style="font-size: 12px; color: rgba(255,255,255,0.5)">Open a job post to begin.</p>
    </div>
  </div>

  <div id="view-profile" style="display: none;" class="container">
    <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
      <div>
        <div class="label">Full Name</div>
        <input id="p-name" type="text" placeholder="John Doe" style="width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 12px; padding: 4px 0;">
      </div>
      <div>
        <div class="label">Email</div>
        <input id="p-email" type="email" placeholder="john@example.com" style="width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 12px; padding: 4px 0;">
      </div>
      <div>
        <div class="label">Phone</div>
        <input id="p-phone" type="text" placeholder="+1..." style="width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 12px; padding: 4px 0;">
      </div>
      <div>
        <div class="label">LinkedIn URL</div>
        <input id="p-linkedin" type="text" placeholder="linkedin.com/in/..." style="width: 100%; background: transparent; border: none; color: white; outline: none; font-size: 12px; padding: 4px 0;">
      </div>
    </div>
    <button id="sync-web-profile" style="background: rgba(242, 170, 76, 0.1); border: 1px solid #F2AA4C; color: #F2AA4C; margin-bottom: 10px;">Sync from Web Profile</button>
    <button id="save-profile">Save Profile</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
