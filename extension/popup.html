<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --primary: #f2aa4c;
        --bg: #0a0a0a;
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.5);
        --success: #2ed573;
        --success-bg: rgba(46, 213, 115, 0.15);
        --danger: #ff4757;
        --danger-bg: rgba(255, 71, 87, 0.15);
      }

      body {
        width: 340px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      h1 {
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
        color: var(--primary);
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        padding: 16px;
        border-radius: 16px;
        margin-bottom: 20px;
        transition: all 0.25s ease;
      }

      .card:hover {
        border-color: rgba(242, 170, 76, 0.15);
        background: rgba(255, 255, 255, 0.04);
      }

      .card-title {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text-muted);
        margin-bottom: 12px;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        font-size: 12px;
      }

      .meta-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .meta-label {
        color: var(--text-muted);
        font-weight: 500;
        width: 80px;
        flex-shrink: 0;
      }

      .meta-value {
        color: var(--text);
        font-weight: 600;
        text-align: right;
        word-break: break-word;
      }

      .warning-text {
        color: var(--primary);
      }

      .danger-text {
        color: var(--danger);
      }

      .btn {
        width: 100%;
        background: var(--primary);
        color: #000000;
        border: none;
        padding: 12px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(242, 170, 76, 0.2);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        border: 1px solid var(--card-border);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: none;
      }

      #customize-btn {
        color: var(--primary);
        border-color: rgba(242, 170, 76, 0.15);
      }

      #customize-btn:hover {
        border-color: rgba(242, 170, 76, 0.35);
        background: rgba(242, 170, 76, 0.03);
      }

      #no-job {
        text-align: center;
        padding: 30px 10px;
      }

      .no-job-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .no-job-desc {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.3);
        line-height: 1.5;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icon.png" class="logo" alt="Logo" />
      <h1>OfferFit</h1>
    </div>

    <div id="job-info" style="display: none">
      <div class="card">
        <div class="card-title">Extracted Job Context</div>
        <div style="display: flex; flex-direction: column">
          <div class="meta-row">
            <span class="meta-label">Position</span>
            <span id="job-role-val" class="meta-value">-</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Company</span>
            <span id="job-company-val" class="meta-value">-</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Location</span>
            <span id="job-location-val" class="meta-value">-</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Role Type</span>
            <span id="job-type-val" class="meta-value">-</span>
          </div>
        </div>
      </div>

      <button id="sync-btn" class="btn">Analyze Match</button>
      <button id="customize-btn" class="btn btn-secondary">
        Customize Resume
      </button>
    </div>

    <div id="no-job" style="display: none">
      <p class="no-job-title">No Job Posting Detected</p>
      <p class="no-job-desc">
        Navigate to a job page on LinkedIn, Wellfound, or YC Jobs to extract and
        start analyzing.
      </p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
